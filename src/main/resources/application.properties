# MySQL connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_contable
spring.datasource.username=contabilidad
spring.datasource.password=walter120706
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Spring Boot banner
spring.main.banner-mode=off

# Server settings
server.port=8080
server.servlet.context-path=/api/contabilidad

# JWT Configuration
jwt.secret=unicaesContabilidadSecretKey2025
jwt.expiration=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.unicaes=DEBUG