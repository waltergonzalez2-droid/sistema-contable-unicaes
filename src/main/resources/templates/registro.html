<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Contable</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/unicaess.jpg}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .register-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(125, 60, 60, 0.4);
        }
        .btn-register {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(125, 60, 60, 0.4);
        }
        .logo-container {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .unicaes-text {
            color: #D4AF37;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="register-card rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
        <!-- Logo/Header Section -->
        <div class="logo-container p-8 text-center">
            <!-- Logo UNICAES Oficial -->
            <div class="inline-flex items-center justify-center mb-4">
                <img th:src="@{/images/unicaess.jpg}" 
                     alt="Logo UNICAES" 
                     class="h-20 w-20 object-cover drop-shadow-2xl rounded-full border-4 border-white">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Crear Cuenta</h1>
            <p class="unicaes-text text-sm font-semibold">Universidad Católica de El Salvador</p>
        </div>        <!-- Form Section -->
        <div class="p-8">
            <!-- Error Message -->
            <div th:if="${error}" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-red-500 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-red-700 text-sm font-medium" th:text="${error}"></span>
                </div>
            </div>

            <!-- Register Form -->
            <form th:action="@{/registro}" method="POST" class="space-y-4">
                <!-- Nombre Completo -->
                <div>
                    <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Nombre Completo
                    </label>
                    <input type="text" id="nombre" name="nombre" required 
                           class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                           style="border-color: #D4AF37;"
                           placeholder="Ej: Juan Pérez">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        Correo Electrónico
                    </label>
                    <input type="email" id="email" name="email" required 
                           class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                           style="border-color: #D4AF37;"
                           placeholder="correo@ejemplo.com">
                </div>

                <!-- Grid for Username and Password -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            Usuario
                        </label>
                        <input type="text" id="username" name="username" required 
                               class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                               style="border-color: #D4AF37;"
                               placeholder="usuario123">
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            Contraseña
                        </label>
                        <input type="password" id="password" name="password" required 
                               class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                               style="border-color: #D4AF37;"
                               placeholder="••••••••"
                               minlength="6">
                    </div>
                </div>

                <!-- Password Requirements Info -->
                <div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded-r-lg">
                    <div class="flex">
                        <svg class="w-5 h-5 text-blue-500 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                        </svg>
                        <p class="text-xs text-blue-700">
                            La contraseña debe tener al menos 6 caracteres
                        </p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="btn-register w-full py-3 px-4 rounded-lg text-white font-bold text-lg shadow-lg mt-6">
                    Crear Cuenta
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    ¿Ya tienes una cuenta? 
                    <a th:href="@{/login}" class="font-semibold hover:underline transition-colors" style="color: #7D3C3C;">
                        Inicia sesión aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
