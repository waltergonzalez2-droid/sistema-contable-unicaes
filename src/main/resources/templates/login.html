<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Contable</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/unicaess.jpg}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(125, 60, 60, 0.4);
        }
        .btn-login {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(125, 60, 60, 0.4);
        }
        .logo-container {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .unicaes-text {
            color: #D4AF37;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="login-card rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <!-- Logo/Header Section -->
        <div class="logo-container p-8 text-center">
            <!-- Logo UNICAES Oficial -->
            <div class="inline-flex items-center justify-center mb-4">
                <img th:src="@{/images/unicaess.jpg}" 
                     alt="Logo UNICAES" 
                     class="h-20 w-20 object-cover drop-shadow-2xl rounded-full border-4 border-white">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Sistema Contable</h1>
            <p class="unicaes-text text-sm font-semibold">Universidad Católica de El Salvador</p>
        </div>

        <!-- Form Section -->
        <div class="p-8">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Iniciar Sesión</h2>
            
            <!-- Error Message -->
            <div th:if="${error}" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-red-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-red-700 text-sm font-medium" th:text="${error}"></span>
                </div>
            </div>

            <!-- Success Message -->
            <div th:if="${success}" class="mb-4 bg-yellow-50 border-l-4 border-yellow-600 p-4 rounded-r-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-yellow-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-yellow-800 text-sm font-medium" th:text="${success}"></span>
                </div>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="POST" class="space-y-5">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Usuario
                    </label>
                    <input type="text" id="username" name="username" required 
                           class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                           style="border-color: #D4AF37;"
                           placeholder="Ingresa tu usuario">
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" required 
                           class="input-field w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none"
                           style="border-color: #D4AF37;"
                           placeholder="Ingresa tu contraseña">
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="btn-login w-full py-3 px-4 rounded-lg text-white font-bold text-lg shadow-lg">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    ¿No tienes una cuenta? 
                    <a th:href="@{/registro}" class="font-semibold hover:underline transition-colors" style="color: #7D3C3C;">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
