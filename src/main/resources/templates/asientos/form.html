<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Asiento - Sistema Contable</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/unicaess.jpg}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .nav-gradient {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .unicaes-accent {
            color: #D4AF37;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="nav-gradient shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <a th:href="@{/dashboard}" class="flex items-center space-x-3">
                        <!-- Logo UNICAES -->
                        <img th:src="@{/images/unicaess.jpg}" 
                             alt="Logo UNICAES" 
                             class="h-12 w-auto rounded-full shadow-lg">
                        <div>
                            <span class="text-2xl font-bold text-white">Sistema Contable</span>
                            <p class="unicaes-accent text-xs font-semibold">Nuevo Asiento</p>
                        </div>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center bg-white bg-opacity-20 rounded-full px-4 py-2 backdrop-blur-sm">
                        <svg class="h-5 w-5 text-white mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span class="text-white font-semibold" th:text="${nombreCompleto} ?: 'Usuario'">Usuario</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full font-semibold transition-all duration-300 shadow-lg hover:shadow-xl">
                            Cerrar Sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${asiento.id == null ? 'Nuevo Asiento Contable' : 'Editar Asiento Contable'}"></title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .unicaes-red-bg {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .input-focus:focus {
            border-color: #7D3C3C;
            --tw-ring-color: #7D3C3C;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <!-- Header -->
    <div class="unicaes-red-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <img th:src="@{/images/unicaess.jpg}" alt="UNICAES" class="h-12">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Sistema Contable</h1>
                        <p class="text-red-100 text-sm">Universidad Católica de El Salvador</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="flex items-center mb-6">
                <div class="rounded-full p-3 mr-4" style="background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);">
                    <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-900" th:text="${asiento.id == null ? 'Nuevo Asiento Contable' : 'Editar Asiento Contable'}"></h2>
            </div>
            
            <!-- Mensajes de Error/Éxito -->
            <div th:if="${error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <div class="flex">
                    <svg class="h-6 w-6 text-red-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-red-700" th:text="${error}"></p>
                </div>
            </div>
            
            <form th:action="@{${asiento.id == null ? '/asientos/nuevo' : '/asientos/' + asiento.id + '/editar'}}" method="POST" th:object="${asiento}" id="asientoForm">
                <input type="hidden" th:field="*{id}">
                
                <div class="space-y-6 mb-8">
                    <!-- Fecha y Descripción -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="fecha" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                                <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                Fecha
                            </label>
                            <input type="datetime-local" id="fecha" name="fecha" th:value="${asiento.fecha != null ? #temporals.format(asiento.fecha, 'yyyy-MM-dd''T''HH:mm') : ''}" required
                                   class="input-focus mt-1 block w-full border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200">
                        </div>
                        <div>
                            <label for="numero" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                                <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path>
                                </svg>
                                Número (Automático)
                            </label>
                            <input type="text" id="numero" name="numero" th:field="*{numero}" readonly placeholder="Se generará automáticamente"
                                   class="mt-1 block w-full border-2 border-gray-200 rounded-xl shadow-sm py-3 px-4 bg-gray-50">
                        </div>
                    </div>

                    <div>
                        <label for="descripcion" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                            </svg>
                            Descripción
                        </label>
                        <textarea id="descripcion" name="descripcion" th:field="*{descripcion}" required rows="3"
                                  placeholder="Descripción del asiento contable..."
                                  class="input-focus mt-1 block w-full border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200"></textarea>
                    </div>
                </div>

                <!-- Detalles del Asiento -->
                <div class="border-t-2 border-gray-200 pt-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                        </svg>
                        Movimientos
                    </h3>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full" id="detallesTable">
                            <thead class="bg-gradient-to-r from-gray-100 to-gray-200">
                                <tr>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Cuenta</th>
                                    <th class="px-4 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wider">Debe</th>
                                    <th class="px-4 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wider">Haber</th>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Referencia</th>
                                    <th class="px-4 py-3 text-center text-xs font-bold text-gray-700 uppercase tracking-wider">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="detallesBody" class="bg-white divide-y divide-gray-200">
                                <!-- Las filas se generarán dinámicamente -->
                            </tbody>
                            <tfoot class="bg-gradient-to-r from-gray-100 to-gray-200 font-bold">
                                <tr>
                                    <td class="px-4 py-3 text-right">TOTALES:</td>
                                    <td class="px-4 py-3 text-right" id="totalDebe">$0.00</td>
                                    <td class="px-4 py-3 text-right" id="totalHaber">$0.00</td>
                                    <td class="px-4 py-3"></td>
                                    <td class="px-4 py-3 text-center">
                                        <span id="diferencia" class="px-3 py-1 text-xs font-semibold rounded-full bg-gray-200 text-gray-700">
                                            Diferencia: $0.00
                                        </span>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    
                    <button type="button" onclick="agregarFila()" class="mt-4 inline-flex items-center px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg font-semibold hover:from-blue-600 hover:to-blue-700 transition-all duration-300">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        Agregar Línea
                    </button>
                </div>

                <div class="mt-8 flex items-center justify-end space-x-4 border-t-2 border-gray-200 pt-6">
                    <a th:href="@{/asientos}" class="inline-flex items-center px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-semibold shadow-md transition-all duration-300">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                        Cancelar
                    </a>
                    <button type="submit" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all duration-300">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Guardar Asiento
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const cuentas = /*[[${cuentas}]]*/ [];
        let filaIndex = 0;

        function agregarFila() {
            const tbody = document.getElementById('detallesBody');
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            row.innerHTML = `
                <td class="px-4 py-3">
                    <select name="cuentaId" required class="block w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:border-red-600 focus:outline-none">
                        <option value="">Seleccione una cuenta</option>
                        ${cuentas.map(c => `<option value="${c.id}">${c.codigo} - ${c.nombre}</option>`).join('')}
                    </select>
                </td>
                <td class="px-4 py-3">
                    <input type="number" name="debe" step="0.01" min="0" value="0" onchange="calcularTotales()" 
                           class="block w-full border border-gray-300 rounded-lg py-2 px-3 text-sm text-right focus:border-red-600 focus:outline-none">
                </td>
                <td class="px-4 py-3">
                    <input type="number" name="haber" step="0.01" min="0" value="0" onchange="calcularTotales()" 
                           class="block w-full border border-gray-300 rounded-lg py-2 px-3 text-sm text-right focus:border-red-600 focus:outline-none">
                </td>
                <td class="px-4 py-3">
                    <input type="text" name="referencia" placeholder="Referencia opcional..." 
                           class="block w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:border-red-600 focus:outline-none">
                </td>
                <td class="px-4 py-3 text-center">
                    <button type="button" onclick="eliminarFila(this)" class="text-red-600 hover:text-red-800 font-semibold">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
            filaIndex++;
        }

        function eliminarFila(btn) {
            btn.closest('tr').remove();
            calcularTotales();
        }

        function calcularTotales() {
            const debes = document.querySelectorAll('input[name="debe"]');
            const haberes = document.querySelectorAll('input[name="haber"]');
            
            let totalDebe = 0;
            let totalHaber = 0;
            
            debes.forEach(input => totalDebe += parseFloat(input.value) || 0);
            haberes.forEach(input => totalHaber += parseFloat(input.value) || 0);
            
            const diferencia = totalDebe - totalHaber;
            
            document.getElementById('totalDebe').textContent = '$' + totalDebe.toFixed(2);
            document.getElementById('totalHaber').textContent = '$' + totalHaber.toFixed(2);
            
            const diferenciaSpan = document.getElementById('diferencia');
            if (Math.abs(diferencia) < 0.01) {
                diferenciaSpan.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800';
                diferenciaSpan.textContent = '✓ Cuadrado';
            } else {
                diferenciaSpan.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800';
                diferenciaSpan.textContent = 'Diferencia: $' + Math.abs(diferencia).toFixed(2);
            }
        }

        // Validación del formulario
        document.getElementById('asientoForm').addEventListener('submit', function(e) {
            const debes = document.querySelectorAll('input[name="debe"]');
            const haberes = document.querySelectorAll('input[name="haber"]');
            
            let totalDebe = 0;
            let totalHaber = 0;
            
            debes.forEach(input => totalDebe += parseFloat(input.value) || 0);
            haberes.forEach(input => totalHaber += parseFloat(input.value) || 0);
            
            const diferencia = Math.abs(totalDebe - totalHaber);
            
            if (diferencia >= 0.01) {
                e.preventDefault();
                alert('El asiento no está cuadrado. El total del DEBE debe ser igual al total del HABER.');
                return false;
            }
            
            if (debes.length === 0) {
                e.preventDefault();
                alert('Debe agregar al menos una línea de movimiento.');
                return false;
            }
        });

        // Inicializar con 4 filas
        window.addEventListener('DOMContentLoaded', function() {
            for (let i = 0; i < 4; i++) {
                agregarFila();
            }
        });
        /*]]>*/
    </script>
</body>
</html>
        </div>
    </div>
</body>
</html>
