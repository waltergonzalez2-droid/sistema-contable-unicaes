<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Contable - Sistema Contable</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/unicaess.jpg}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .nav-gradient {
            background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);
        }
        .unicaes-accent {
            color: #D4AF37;
        }
        .input-focus:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="nav-gradient shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <a th:href="@{/dashboard}" class="flex items-center space-x-3">
                        <!-- Logo UNICAES -->
                        <img th:src="@{/images/unicaess.jpg}" 
                             alt="Logo UNICAES" 
                             class="h-12 w-auto rounded-full shadow-lg">
                        <div>
                            <span class="text-2xl font-bold text-white">Sistema Contable</span>
                            <p class="unicaes-accent text-xs font-semibold">Cuenta Contable</p>
                        </div>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center bg-white bg-opacity-20 rounded-full px-4 py-2 backdrop-blur-sm">
                        <svg class="h-5 w-5 text-white mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span class="text-white font-semibold" th:text="${nombreCompleto} ?: 'Usuario'">Usuario</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full font-semibold transition-all duration-300 shadow-lg hover:shadow-xl">
                            Cerrar Sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="flex items-center mb-6">
                <div class="bg-gradient-to-r rounded-full p-3 mr-4" style="background: linear-gradient(135deg, #7D3C3C 0%, #5A2D2D 100%);">
                    <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-900" th:text="${cuenta.id == null ? 'Nueva Cuenta' : 'Editar Cuenta'}"></h2>
            </div>
            
            <form th:action="@{${cuenta.id == null ? '/cuentas/nueva' : '/cuentas/' + cuenta.id + '/editar'}}" method="POST" th:object="${cuenta}">
                <input type="hidden" th:field="*{id}">
                
                <div class="space-y-6">
                    <!-- Código -->
                    <div>
                        <label for="codigo" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path>
                            </svg>
                            Código de Cuenta
                        </label>
                        <input type="text" id="codigo" name="codigo" th:field="*{codigo}" required
                               placeholder="Ej: 1001"
                               class="input-focus mt-1 block w-full border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200">
                    </div>

                    <!-- Nombre -->
                    <div>
                        <label for="nombre" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                            </svg>
                            Nombre de la Cuenta
                        </label>
                        <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required
                               placeholder="Ej: Caja General"
                               class="input-focus mt-1 block w-full border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200">
                    </div>

                    <!-- Tipo de Cuenta -->
                    <div>
                        <label for="tipo" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                            </svg>
                            Tipo de Cuenta
                        </label>
                        <select id="tipo" name="tipo" th:field="*{tipo}" required
                                class="input-focus mt-1 block w-full bg-white border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200">
                            <option value="">Seleccione un tipo</option>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="PASIVO">PASIVO</option>
                            <option value="PATRIMONIO">PATRIMONIO</option>
                            <option value="INGRESO">INGRESO</option>
                            <option value="GASTO">GASTO</option>
                        </select>
                    </div>

                    <!-- Naturaleza -->
                    <div>
                        <label for="naturaleza" class="flex items-center text-sm font-bold text-gray-700 mb-2">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                            </svg>
                            Naturaleza de la Cuenta
                        </label>
                        <select id="naturaleza" name="naturaleza" th:field="*{naturaleza}" required
                                class="input-focus mt-1 block w-full bg-white border-2 border-gray-300 rounded-xl shadow-sm py-3 px-4 focus:outline-none transition-all duration-200">
                            <option value="">Seleccione la naturaleza</option>
                            <option value="DEUDORA">DEUDORA</option>
                            <option value="ACREEDORA">ACREEDORA</option>
                        </select>
                    </div>

                    <!-- Estado -->
                    <div class="rounded-xl p-4 border-2" style="background-color: rgba(125, 60, 60, 0.05); border-color: rgba(125, 60, 60, 0.3);">
                        <div class="flex items-start">
                            <div class="flex items-center h-5">
                                <input id="activo" name="activo" type="checkbox" th:field="*{activo}"
                                       class="h-5 w-5 border-gray-300 rounded" style="color: #7D3C3C; --tw-ring-color: #7D3C3C;">
                            </div>
                            <div class="ml-3">
                                <label for="activo" class="font-bold text-gray-900 flex items-center">
                                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #7D3C3C;">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Cuenta Activa
                                </label>
                                <p class="text-sm text-gray-600 mt-1">Marque esta casilla si la cuenta está activa y puede ser utilizada</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex items-center justify-end space-x-4">
                    <a th:href="@{/cuentas}" class="inline-flex items-center px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-semibold shadow-md transition-all duration-300">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                        Cancelar
                    </a>
                    <button type="submit" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all duration-300">
                        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Guardar Cuenta
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
